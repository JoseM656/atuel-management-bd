# nginx del front: sirve los estáticos de front/ y reenvía /api/ a la API.
# Front y API quedan en el mismo origen (http://127.0.0.1:8080), así el
# navegador no hace pedidos cross-origin y la API no necesita CORS.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx.conf vive en front/, que se sirve completa: no exponerlo.
    location = /nginx.conf {
        return 404;
    }

    # Estáticos: index.html, js/, css/.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API. La barra final de proxy_pass le saca el prefijo /api:
    #   /api/vinos?tipo=tinto  →  http://api:3333/vinos?tipo=tinto
    # "api" es el nombre del servicio en docker-compose.yml.
    location /api/ {
        proxy_pass http://api:3333/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

openapi: 3.0.3
info:
  title: Bodegas del Atuel — API
  version: 0.2.0
  description: |
    API REST de la capa de datos (Etapa 6). Hoy expone `/salud` y el CRUD de
    `/vinos`; se irán agregando clientes, comprobantes, transferencias,
    ingresos y reportes (S1–S12).
servers:
  - url: http://localhost:3333
    description: Local

paths:
  /salud:
    get:
      summary: Verifica que la API llega a la base
      responses:
        "200":
          description: API y base accesibles
        "503":
          description: Base no accesible

  /vinos:
    get:
      summary: Lista de vinos con su bodega (filtros y paginación)
      parameters:
        - name: nombre
          in: query
          required: false
          description: Búsqueda parcial por nombre, sin distinguir mayúsculas (ILIKE '%texto%'). Los comodines % y _ se buscan como texto.
          schema: { type: string }
        - name: tipo
          in: query
          required: false
          description: Filtro por tipo (tinto, blanco, rosado, espumante)
          schema: { type: string }
        - name: cepa
          in: query
          required: false
          description: Filtro por nombre de cepa (ej. Malbec)
          schema: { type: string }
        - name: bodega
          in: query
          required: false
          description: Filtro por razón social de la bodega
          schema: { type: string }
        - name: anada
          in: query
          required: false
          description: Filtro por año de cosecha
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          description: Tamaño de página (default 20)
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          description: Filas a saltear (default 0)
          schema: { type: integer }
      responses:
        "200":
          description: Página de vinos con total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VinosPagina" }
        "400":
          description: Parámetro inválido
    post:
      summary: Alta de un vino con su composición de cepas y maridajes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VinoNuevo" }
      responses:
        "201":
          description: Vino creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  cod_vino: { type: integer }
        "409":
          description: Regla violada (cortes no suman 100, sin maridaje, etc.)
        "422":
          description: CHECK violado (precio, graduación, etc.)

  /vinos/{cod}:
    get:
      summary: Ficha de un vino (S9)
      parameters:
        - name: cod
          in: path
          required: true
          description: Código del vino
          schema: { type: integer }
      responses:
        "200":
          description: Ficha del vino
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VinoDetalle" }
        "404":
          description: Vino no encontrado
    put:
      summary: Reemplaza los campos de un vino (el cambio de precio se audita)
      description: |
        Si el cuerpo trae `cepas` y/o `maridajes`, se reemplazan completos en la
        misma transacción. RN-05 (suma = 100) y el maridaje obligatorio son
        triggers diferidos: si no se cumplen, el COMMIT falla (409) y no se
        guarda ningún cambio. Si no vienen, el corte y los maridajes no se tocan.
      parameters:
        - name: cod
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VinoActualizar" }
      responses:
        "204":
          description: Vino actualizado
        "404":
          description: Vino no encontrado
        "409":
          description: Regla violada
        "422":
          description: CHECK violado
    delete:
      summary: Baja de un vino (RN-14 lo rechaza si tiene movimientos)
      parameters:
        - name: cod
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Vino eliminado
        "404":
          description: Vino no encontrado
        "409":
          description: Tiene movimientos/auditoría (RN-14)

  /clientes:
    get:
      summary: Lista de clientes con su subtipo (filtro, búsqueda y paginación)
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Búsqueda: ID exacto (aparece primero), documento que empieza con los
            dígitos escritos (se ignoran guiones) o nombre que contiene el texto.
          schema: { type: string }
        - name: tipo
          in: query
          required: false
          description: Filtro por tipo (socio, distribuidor, exportador)
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Página de clientes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientesPagina" }
    post:
      summary: Alta de un cliente con su subtipo (el descuento lo asigna la base)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClienteNuevo" }
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_cliente: { type: integer }
        "400":
          description: Tipo inválido
        "409":
          description: Duplicado (tipo_doc, nro_doc)
        "422":
          description: NOT NULL violado

  /clientes/{id}:
    get:
      summary: Cliente con su subtipo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
        "404":
          description: No encontrado
    put:
      summary: Reemplaza campos comunes y del subtipo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClienteActualizar" }
      responses:
        "204":
          description: Actualizado
        "404":
          description: No encontrado
        "422":
          description: NOT NULL violado
    delete:
      summary: Baja de un cliente (RN-14 lo rechaza si tiene comprobantes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Eliminado
        "404":
          description: No encontrado
        "409":
          description: Tiene comprobantes (RN-14)

  /comprobantes/simular:
    post:
      summary: Simula una venta sin guardarla (ROLLBACK)
      description: |
        Hace los mismos INSERT que POST /comprobantes, con los mismos triggers
        (RN-08, RN-09, RI-03), lee los importes calculados por la base y
        termina en ROLLBACK: no se guarda nada ni se descuenta stock. La
        pantalla de venta lo usa para mostrar precios y total antes de
        confirmar. La secuencia de comprobante.nro no retrocede, así que cada
        simulación consume un número. `nro` vuelve en 0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComprobanteNuevo" }
      responses:
        "200":
          description: Importes calculados por la base
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComprobanteDetalle" }
        "409":
          description: Sin stock (RN-09) u otra regla violada
        "422":
          description: CHECK violado (cantidad <= 0, etc.)

  /comprobantes:
    post:
      summary: Venta transaccional (cabecera + renglones)
      description: |
        Crea un comprobante con sus renglones en una sola transacción. La API
        no envía ni calcula precios: descuento, precio unitario, subtotal y
        total los resuelve la base con sus funciones y triggers (RN-08, RN-09,
        RI-03). Vender sin stock devuelve 409 y no deja datos a medias.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComprobanteNuevo" }
      responses:
        "201":
          description: Comprobante creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  nro: { type: integer }
        "409":
          description: Sin stock (RN-09) u otra regla violada
        "422":
          description: CHECK violado (cantidad <= 0, etc.)

  /comprobantes/{nro}:
    get:
      summary: Comprobante con sus renglones
      parameters:
        - name: nro
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Comprobante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComprobanteDetalle" }
        "404":
          description: No encontrado

  /transferencias:
    get:
      summary: Lista de transferencias (filtros y paginación)
      description: |
        Ordenadas de la más reciente a la más antigua. Un estado que no existe
        en el ENUM estado_documento lo rechaza la base (22P02 → 400).
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtro por estado
          schema: { type: string, enum: [en_confeccion, terminado, procesado] }
        - name: id_sala
          in: query
          required: false
          description: Filtro por sala
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          description: Tamaño de página (default 20, mínimo 1)
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          description: Filas a saltear (default 0)
          schema: { type: integer }
      responses:
        "200":
          description: Página de transferencias con total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferenciasPagina" }
        "400":
          description: Parámetro inválido (estado inexistente, limit < 1, etc.)
    post:
      summary: Alta de una transferencia (en_confeccion)
      description: |
        Crea una transferencia para una sala. La fecha de confección la fuerza
        la base a la fecha actual y el estado nace en_confeccion (RN-11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_sala]
              properties:
                id_sala: { type: integer }
      responses:
        "201":
          description: Transferencia creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  nro: { type: integer }
        "422":
          description: NOT NULL violado (sala inexistente → 409 por FK)

  /transferencias/{nro}:
    get:
      summary: Transferencia con su estado actual y sus renglones
      description: |
        El front usa `estado` para habilitar los botones Terminar / Procesar
        (RN-11: en_confeccion → terminado → procesado).
      parameters:
        - name: nro
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Transferencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferenciaDetalle" }
        "400":
          description: Número inválido
        "404":
          description: No encontrada

  /transferencias/{nro}/renglones:
    post:
      summary: Carga renglones a una transferencia en confección
      description: |
        Agrega renglones mientras la transferencia está en_confeccion (RN-12).
        Fuera de confección devuelve 409.
      parameters:
        - name: nro
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/RenglonTransferenciaInput" }
      responses:
        "204":
          description: Renglones agregados
        "409":
          description: Transferencia no en confección (RN-12)

  /transferencias/{nro}/renglones/{cod}:
    delete:
      summary: Quita el renglón de un vino de una transferencia en confección
      description: |
        Borra el renglón mientras la transferencia está en_confeccion. Fuera de
        confección lo rechaza el trigger trg_renglon_transferencia_doc (RN-12).
      parameters:
        - name: nro
          in: path
          required: true
          schema: { type: integer }
        - name: cod
          in: path
          required: true
          description: cod_vino del renglón
          schema: { type: integer }
      responses:
        "204":
          description: Renglón quitado
        "404":
          description: El renglón no existe
        "409":
          description: Transferencia no en confección (RN-12)

  /transferencias/{nro}/terminar:
    post:
      summary: Pasa la transferencia de en_confeccion a terminado
      parameters:
        - name: nro
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Terminada
        "409":
          description: Estado inválido (no en_confeccion) o no existe

  /transferencias/{nro}/procesar:
    post:
      summary: Procesa la transferencia (mueve stock)
      description: |
        Invoca sp_procesar_transferencia: descuenta del depósito, suma a la
        sala y pasa a procesado. Stock insuficiente → 409 sin cambios a medias.
      parameters:
        - name: nro
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Procesada
        "409":
          description: Estado inválido, no existe o stock insuficiente

  /ingresos:
    post:
      summary: Alta de un ingreso (en_confeccion)
      description: |
        Crea un ingreso para un transportista y una bodega. La base valida que
        el transportista cubra la localidad del depósito (RI-05) y pone
        fecha/estado (RN-10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cod_transportista, cuit_bodega]
              properties:
                cod_transportista: { type: integer }
                cuit_bodega: { type: string }
      responses:
        "201":
          description: Ingreso creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  cod_ingreso: { type: integer }
        "409":
          description: Transportista no cubre el depósito (RI-05)

  /ingresos/{cod}/renglones:
    post:
      summary: Carga renglones a un ingreso en confección
      description: |
        Agrega renglones mientras el ingreso está en_confeccion (RN-12). Los
        vinos deben ser de la bodega de origen (RI-04).
      parameters:
        - name: cod
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/RenglonIngresoInput" }
      responses:
        "204":
          description: Renglones agregados
        "409":
          description: No en confección (RN-12) o vino ajeno (RI-04)

  /ingresos/{cod}/terminar:
    post:
      summary: Pasa el ingreso de en_confeccion a terminado
      parameters:
        - name: cod
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Terminado
        "409":
          description: Estado inválido o no existe

  /ingresos/{cod}/procesar:
    post:
      summary: Procesa el ingreso (impacta el depósito)
      description: |
        Invoca sp_procesar_ingreso: suma los renglones al stock del depósito y
        pasa a procesado. Solo un ingreso terminado impacta el depósito (RN-10).
      parameters:
        - name: cod
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Procesado
        "409":
          description: Estado inválido o no existe

  /salas:
    get:
      summary: Salas de venta (catálogo para desplegables)
      description: Lista completa, sin paginar, ordenada por localidad y dirección.
      responses:
        "200":
          description: Salas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sala" }

  /cepas:
    get:
      summary: Cepas (catálogo para desplegables y filtro ?cepa= de /vinos)
      responses:
        "200":
          description: Cepas ordenadas por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CepaItem" }

  /bodegas:
    get:
      summary: Bodegas (catálogo para desplegables y filtro ?bodega= de /vinos)
      responses:
        "200":
          description: Bodegas ordenadas por razón social
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bodega" }

  /maridajes:
    get:
      summary: Maridajes (catálogo para el alta de vino)
      responses:
        "200":
          description: Maridajes ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaridajeItem" }

  /reportes/s1:
    get:
      summary: S1 · Top 10 vinos por botellas vendidas
      responses:
        "200":
          description: Ranking de vinos
  /reportes/s2:
    get:
      summary: S2 · Vinos vendidos en todas las salas
      responses:
        "200":
          description: Lista de vinos
  /reportes/s3:
    get:
      summary: S3 · Clientes por tipo que compraron en una sala (última semana)
      parameters:
        - name: sala
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cantidad por tipo
  /reportes/s4:
    get:
      summary: S4 · Top 5 salas que pidieron un vino por transferencia (15 días)
      parameters:
        - name: vino
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ranking de salas
  /reportes/s5:
    get:
      summary: S5 · Salas con menos transferencias pendientes
      responses:
        "200":
          description: Lista de salas
  /reportes/s6:
    get:
      summary: S6 · Vinos sin stock en sala pero con stock en depósito
      parameters:
        - name: sala
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Lista de vinos
  /reportes/s7:
    get:
      summary: S7 · Transportista más activo del último mes
      responses:
        "200":
          description: Transportista
  /reportes/s8:
    get:
      summary: S8 · Monto de ventas por sala en el último trimestre
      responses:
        "200":
          description: Montos por sala
  /reportes/s9:
    get:
      summary: S9 · Ficha de un vino (cepas, bodega, maridajes, stock)
      parameters:
        - name: vino
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ficha del vino
  /reportes/s10:
    get:
      summary: S10 · Rendimiento kg/ha por parcela/campaña vs promedio de finca
      responses:
        "200":
          description: Rendimientos
  /reportes/s11:
    get:
      summary: S11 · Ranking de vinos por sala y acumulado mensual por sala
      responses:
        "200":
          description: Ranking y acumulados
  /reportes/s12a:
    get:
      summary: S12a · Clientes que compraron todos los vinos de una bodega
      parameters:
        - name: bodega
          in: query
          required: true
          description: CUIT de la bodega (11 dígitos)
          schema: { type: string }
      responses:
        "200":
          description: Clientes
  /reportes/s12b:
    get:
      summary: S12b · Clientes que nunca compraron vino tinto
      responses:
        "200":
          description: Clientes

components:
  schemas:
    Vino:
      type: object
      properties:
        cod_vino: { type: integer }
        nombre: { type: string }
        tipo: { type: string }
        anada: { type: integer }
        volumen_ml: { type: integer }
        graduacion: { type: number }
        precio: { type: number }
        bodega: { type: string }
        cepas: { type: string, description: "Corte, de mayor a menor porcentaje (ej. \"Merlot, Syrah, Bonarda\")" }
        stock_total: { type: integer, description: "Depósito + salas (vista v_stock_total_vino)" }
    VinosPagina:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        vinos:
          type: array
          items: { $ref: "#/components/schemas/Vino" }
    VinoDetalle:
      type: object
      properties:
        cod_vino: { type: integer }
        nombre: { type: string }
        tipo: { type: string }
        anada: { type: integer }
        volumen_ml: { type: integer }
        graduacion: { type: number }
        precio: { type: number }
        cuit_bodega: { type: string }
        bodega: { type: string }
        stock_deposito: { type: integer }
        stock_salas: { type: integer }
        stock_total: { type: integer, description: "Depósito + salas (vista v_stock_total_vino)" }
        cepas:
          type: array
          items: { $ref: "#/components/schemas/Cepa" }
        maridajes:
          type: array
          items: { $ref: "#/components/schemas/Maridaje" }
    Cepa:
      type: object
      properties:
        id_cepa: { type: integer }
        nombre: { type: string }
        porcentaje: { type: number }
    Maridaje:
      type: object
      properties:
        id_maridaje: { type: integer }
        nombre: { type: string }
        temperatura_servicio: { type: number }
    VinoNuevo:
      type: object
      required: [nombre, tipo, anada, volumen_ml, graduacion, precio, cuit_bodega, cepas, maridajes]
      properties:
        nombre: { type: string }
        tipo: { type: string }
        anada: { type: integer }
        volumen_ml: { type: integer }
        graduacion: { type: number }
        precio: { type: number }
        cuit_bodega: { type: string }
        cepas:
          type: array
          items: { $ref: "#/components/schemas/CepaInput" }
        maridajes:
          type: array
          items: { type: integer }
    CepaInput:
      type: object
      properties:
        id_cepa: { type: integer }
        porcentaje: { type: number }
    VinoActualizar:
      type: object
      required: [nombre, tipo, anada, volumen_ml, graduacion, precio, cuit_bodega]
      properties:
        nombre: { type: string }
        tipo: { type: string }
        anada: { type: integer }
        volumen_ml: { type: integer }
        graduacion: { type: number }
        precio: { type: number }
        cuit_bodega: { type: string }
        cepas:
          type: array
          description: Opcional. Si viene, reemplaza el corte completo (RN-05).
          items: { $ref: "#/components/schemas/CepaInput" }
        maridajes:
          type: array
          description: Opcional. Si viene, reemplaza los maridajes (al menos uno).
          items: { type: integer }
    Cliente:
      type: object
      properties:
        id_cliente: { type: integer }
        nombre_razon_social: { type: string }
        tipo_doc: { type: string }
        nro_doc: { type: string }
        direccion: { type: string }
        id_localidad: { type: integer }
        localidad: { type: string }
        provincia: { type: string }
        fecha_alta: { type: string }

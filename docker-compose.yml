# Base de datos de desarrollo: aplica db/migrations en orden y carga db/dev/datos_prueba.sql.
# Las migraciones solo corren con el volumen vacío; para recrear la base:
#   docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16
    container_name: atuel_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - atuel_data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
      - ./db/dev:/dev-data:ro
      - ./db/docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atuel_data:
